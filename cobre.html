<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Átomo de Cobre — Modelo de Bohr</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Rajdhani:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f7f4ee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Crimson Pro', Georgia, serif;
    color: #222;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #445;
  }

  header p {
    font-style: italic;
    font-size: 0.92rem;
    color: #778;
    margin-top: 3px;
  }

  .wrap {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  canvas { display: block; }

  /* Right-side labels panel */
  .labels {
    display: flex;
    flex-direction: column;
    gap: 0px;
    font-family: 'Crimson Pro', Georgia, serif;
  }

  .lbl {
    font-size: 0.88rem;
    color: #334;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    white-space: nowrap;
  }

  .lbl-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8eef8, #7a90c4);
    border: 1px solid #3a4a7a;
    flex-shrink: 0;
  }

  .lbl span {
    font-style: italic;
    color: #556;
    font-size: 0.82rem;
  }

  footer {
    margin-top: 20px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.67rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #bbc;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>El Átomo de Cobre</h1>
  <p>Figura 2-4 — 29 protones · 4 capas de electrones</p>
</header>

<div class="wrap">
  <canvas id="cu" width="520" height="520"></canvas>

  <div class="labels">
    <div class="lbl"><div class="lbl-dot"></div> 4a. capa: <span>&nbsp;1 electrón &nbsp;(valencia)</span></div>
    <div class="lbl"><div class="lbl-dot"></div> 3a. capa: <span>&nbsp;18 electrones</span></div>
    <div class="lbl"><div class="lbl-dot"></div> 2a. capa: <span>&nbsp;8 electrones</span></div>
    <div class="lbl"><div class="lbl-dot"></div> 1a. capa: <span>&nbsp;2 electrones</span></div>
    <div class="lbl" style="margin-top:14px; color:#a03020;">
      <div style="width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8f6,#ecc0a8);border:1px solid #a02010;flex-shrink:0"></div>
      Núcleo: <span>&nbsp;29 protones</span>
    </div>
  </div>
</div>

<footer>Fórmula de capacidad por capa: 2N² &nbsp;|&nbsp; El cobre es excelente conductor eléctrico</footer>

<script>
const canvas = document.getElementById('cu');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const cx = W / 2, cy = H / 2;

// Shell definitions: [radius, electronCount, speed (rad/s), startAngle]
const shells = [
  { r: 44,  n: 2,  speed:  2.2,  t: 0 },
  { r: 100, n: 8,  speed:  1.4,  t: Math.PI / 8 },
  { r: 168, n: 18, speed:  0.85, t: 0 },
  { r: 236, n: 1,  speed:  0.45, t: Math.PI / 4 },
];

const eR = 7; // electron radius

function drawNucleus() {
  const r = 28;
  ctx.save();
  ctx.shadowColor = 'rgba(150,60,20,0.3)';
  ctx.shadowBlur = 14;
  const g = ctx.createRadialGradient(cx-8, cy-8, 2, cx, cy, r);
  g.addColorStop(0, '#fff9f6');
  g.addColorStop(0.6, '#e8c4a0');
  g.addColorStop(1, '#c87840');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = '#a05020';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#7a2808';
  ctx.font = 'bold 13px "Rajdhani", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('+29', cx, cy);
}

function drawOrbit(r) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(100,110,130,0.28)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
}

function drawElectron(x, y) {
  ctx.save();
  ctx.shadowColor = 'rgba(50,70,160,0.28)';
  ctx.shadowBlur = 6;
  const g = ctx.createRadialGradient(x - eR*0.3, y - eR*0.3, eR*0.1, x, y, eR);
  g.addColorStop(0, '#eaf0fb');
  g.addColorStop(1, '#7a90c4');
  ctx.beginPath();
  ctx.arc(x, y, eR, 0, Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = '#3a4a7a';
  ctx.lineWidth = 1.0;
  ctx.stroke();
  ctx.restore();
}

function drawShell(shell) {
  const { r, n, t } = shell;
  drawOrbit(r);
  for (let i = 0; i < n; i++) {
    const angle = t + (i / n) * Math.PI * 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    drawElectron(x, y);
  }
}

// Draw connector arrow from nucleus label area downward (like textbook)
function drawNucleusLabel() {
  // "29 protones" label at bottom-left
  const lx = cx - 148, ly = cy + 210;
  ctx.save();
  ctx.font = '13px "Crimson Pro", Georgia, serif';
  ctx.fillStyle = '#334';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('29 protones', lx, ly);

  // line pointing to nucleus
  ctx.beginPath();
  ctx.moveTo(lx + 68, ly - 3);
  ctx.lineTo(cx - 20, cy + 22);
  ctx.strokeStyle = '#bbc';
  ctx.lineWidth = 0.85;
  ctx.stroke();
  ctx.restore();
}

// ── Animation loop ────────────────────────────────────────────────────────────
let last = null;

function loop(ts) {
  if (!last) last = ts;
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;

  for (const s of shells) s.t += s.speed * dt;

  ctx.clearRect(0, 0, W, H);

  // Draw orbits + electrons (outer to inner so inner draws on top)
  for (let i = shells.length - 1; i >= 0; i--) drawShell(shells[i]);

  drawNucleus();
  drawNucleusLabel();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
